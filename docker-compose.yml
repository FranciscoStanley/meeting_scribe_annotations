services:
  whisper:
    image: fedirz/faster-whisper-server:latest
    ports:
      - '${WHISPER_PORT:-8080}:8000'
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-base}
      WHISPER__INFERENCE_DEVICE: cpu
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: file:./data/prod.db
      STT_BASE_URL: http://whisper:8000/v1
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MEETING_ALERT_MINUTES: ${MEETING_ALERT_MINUTES:-3}
      MEETING_ALERT_GRACE_MINUTES: ${MEETING_ALERT_GRACE_MINUTES:-5}
    volumes:
      - backend-data:/app/backend/prisma/data
    depends_on:
      whisper:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # URL que o navegador do usuário usa para falar com a API (IP/domínio do servidor)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: http://backend:3001
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
