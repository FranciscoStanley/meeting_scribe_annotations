name: Bug report
description: Reportar um defeito reproduzível
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Sem secrets. Para vulnerabilidades, use [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: O que aconteceu vs. o esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Ambiente
      placeholder: "Windows 11 · Node 20 · npm run dev"
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidências
      description: Trechos relevantes (sem tokens)
